apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-python
  labels:
    app: sample-app-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app-python
  template:
    metadata:
      labels:
        app: sample-app-python
    spec:
      containers:
        - name: sample-app-python 
          image: angurajnagaraj/python-app-sample:v1
          ports:
            - containerPort: 8000

